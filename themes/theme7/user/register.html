<div class="all-wrapper menu-side with-pattern">
<div class="auth-box-w wider">
<div class="logo-w">
<a href="../index.html">
<img alt="" src="../admin/logo/silversovranbank-logo.png" width='180'></a></div>


<h4 class="auth-header">Personal Information</h4>
<form action="https://silversovranbank.com/user/register" method="post" enctype="multipart/form-data">
<div class="form-group">
<label for=""> First Name</label>
<input class="form-control" placeholder="Enter First Name" required name='firstname' type="text">
</div>
<div class="row">
<div class="col-sm-6">
<div class="form-group">
<label for=""> Last Name</label>
<input class="form-control" placeholder="Enter Last Name" required name='lastname' type="text">
</div></div>
<div class="col-sm-6">
<div class="form-group">
<label for="">Username</label>
<input class="form-control" placeholder="Enter Username" name='username' required type="username"></div>
</div>
</div>

<div class="form-group">
<label for=""> Email address</label>
<input class="form-control" placeholder="Enter email" required name='email' type="email">
</div>

<div class="row">
<div class="col-sm-6">
<div class="form-group">
<label for=""> Password</label>
<input class="form-control" placeholder="Password" name='password' required type="password">
</div></div>
<div class="col-sm-6">
<div class="form-group">
<label for="">Confirm Password</label>
<input class="form-control" placeholder="Password" name='cpassword' required type="password"></div>
</div>
</div>


<div class="row">
<div class="col-sm-6">
<div class="form-group">
<label for=""> Date of birth</label>
<input class="form-control" placeholder="Enter Date of birth" name='dob' required type="date">
</div></div>
<div class="col-sm-6">
<div class="form-group">
<label for="">Gender</label><select name="gender" id="" class="form-control">
<option value="Male" class="option">Male</option>
<option value="Female" class="option">Female</option>
</select>
</div>
</div>
</div>



<h4 class="auth-header">Contact Information</h4>

<div class="form-group">
<label for=""> Home Address</label>
<input class="form-control" placeholder="Enter Home Address" name='address' required type="text">
</div>

<div class="row">
<div class="col-sm-6">
<div class="form-group">
<label for=""> Country</label>
<input class="form-control" placeholder="Country" type="text" name='country'>
</div></div>
<div class="col-sm-6">
<div class="form-group">
<label for="">Zipcode</label>
<input class="form-control" placeholder="Enter Zipcode" required name='zipcode' type="text"></div>
</div>
</div>

<div class="form-group">
<label for=""> Phone Number</label>
<input class="form-control" placeholder="Enter Phone Number" name='phone' required type="text">
</div>

<h4 class="auth-header">Account Information</h4>

<div class="form-group">
<label for=""> Account Pin</label>
<input class="form-control" placeholder="Enter Account Pin" required name='pin' type="password">
</div>

<div class="row">
<div class="col-sm-6">
<div class="form-group">
<label for=""> Account Type</label>
<select name="acctype" id="" class="form-control">
<option value="Checking Account">Checking Account</option>
					                           <option value="Saving Account">Saving Account</option>
					                             <option value="Fixed deposit Account">Fixed deposit Account</option>
												 </select>
</div></div>

<div class="col-sm-6">
<div class="form-group">
<label for="">Currency</label>
<select name="currency" id="" class="form-control">
 <option value="Dollar">Dollar</option>
					<option value="Euro">Euro</option>
                    <option value="Pounds">Pounds</option>
                    <option value="Chinese Yuan">Chinese Yuan</option>
					<option value="Hong Kong Dollar">Hong Kong Dollar </option>
                    <option value="Indonesian Rupiah ">Indonesian Rupiah </option>
                    <option value="Indian Rupee">Indian Rupee</option>
					<option value="Japanese Yen">Japanese Yen </option>
                    <option value="Malaysian Ringgit">Malaysian Ringgit </option>
                    <option value="New Zealand Dollar">New Zealand Dollar </option>
					<option value="Philippine Peso">Philippine Peso </option>
                    <option value="Singapore Dollar">Singapore Dollar </option>
                    <option value="South Korean Won">South Korean Won  </option>
                    <option value="Sri Lankan Rupee">Sri Lankan Rupee  </option>
                    <option value="Thai Baht">Thai Baht  </option>
                     <option value="Vietnamese Dong">Vietnamese Dong  </option>
                      <option value="Emirati Dirham">Emirati Dirham  </option>
                      <option value="Cambodian Riel">Cambodian Riel </option>
</select>

</div>
</div>
</div>


<div class="form-group">
<label for="">Occupation</label>
<input class="form-control" placeholder="Enter Occupation" required name='occupation' type="text">
</div>



<div class="form-group">
<label for="">Upload Profile</label>
<input class="form-control" required name='fileToUploadss' type="file">
</div>


<input type='submit' name='submit'  class="btn btn-primary" value='Register Now'>

<a class="btn btn-info"  href='#'>Log me in</a>


</div></form>
